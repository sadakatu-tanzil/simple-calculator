<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Simple Calculator</title>

    <!-- project css -->
    <link
      rel="stylesheet"
      href="./css/main.css" />
  </head>

  <body>
    <div class="calculator">
      <div class="calculator__head">
        <div class="calculator__screen">
          <p class="calculator__text">0</p>
        </div>
      </div>

      <div class="calculator__body">
        <div class="calculator__buttons">
          <div class="calculator__button-row">
            <button
              class="calculator__button"
              data-button-type="operator">
              <span class="calculator__button-text">√</span>
            </button>
            <button
              class="calculator__button"
              data-button-type="ce">
              <span class="calculator__button-text">CE</span>
            </button>
            <button
              class="calculator__button"
              data-button-type="c">
              <span class="calculator__button-text">C</span>
            </button>
            <button
              class="calculator__button"
              data-button-type="operator">
              <span class="calculator__button-text">/</span>
            </button>
          </div>

          <div class="calculator__button-row">
            <button
              class="calculator__button"
              data-button-type="numeric"
              data-button-value="7">
              <span class="calculator__button-text">7</span>
            </button>
            <button
              class="calculator__button"
              data-button-type="numeric"
              data-button-value="8">
              <span class="calculator__button-text">8</span>
            </button>
            <button
              class="calculator__button"
              data-button-type="numeric"
              data-button-value="9">
              <span class="calculator__button-text">9</span>
            </button>
            <button
              class="calculator__button"
              data-button-type="operator">
              <span class="calculator__button-text">*</span>
            </button>
          </div>

          <div class="calculator__button-row">
            <button
              class="calculator__button"
              data-button-type="numeric"
              data-button-value="4">
              <span class="calculator__button-text">4</span>
            </button>
            <button
              class="calculator__button"
              data-button-type="numeric"
              data-button-value="5">
              <span class="calculator__button-text">5</span>
            </button>
            <button
              class="calculator__button"
              data-button-type="numeric"
              data-button-value="6">
              <span class="calculator__button-text">6</span>
            </button>
            <button
              class="calculator__button"
              data-button-type="operator">
              <span class="calculator__button-text">-</span>
            </button>
          </div>

          <div class="calculator__button-row">
            <button
              class="calculator__button"
              data-button-type="numeric"
              data-button-value="1">
              <span class="calculator__button-text">1</span>
            </button>
            <button
              class="calculator__button"
              data-button-type="numeric"
              data-button-value="2">
              <span class="calculator__button-text">2</span>
            </button>
            <button
              class="calculator__button"
              data-button-type="numeric"
              data-button-value="3">
              <span class="calculator__button-text">3</span>
            </button>
            <button
              class="calculator__button"
              data-button-type="operator">
              <span class="calculator__button-text">+</span>
            </button>
          </div>

          <div class="calculator__button-row">
            <button
              class="calculator__button"
              data-button-type="numeric"
              data-button-value="0">
              <span class="calculator__button-text">0</span>
            </button>
            <button
              class="calculator__button"
              data-button-type="numeric"
              data-button-value="00">
              <span class="calculator__button-text">00</span>
            </button>
            <button
              class="calculator__button"
              data-button-type="numeric"
              data-button-value="."
              disabled>
              <span class="calculator__button-text">.</span>
            </button>
            <button
              class="calculator__button"
              data-button-type="equal">
              <span class="calculator__button-text">=</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="./js/main.js"></script>
  </body>
</html>
