<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta
            content="width=device-width, initial-scale=1.0"
            name="viewport"/>
    <title>Simple Calculator</title>

    <link href="./assets/favicon.png"
          rel="shortcut icon"
          type="image/x-icon">

    <!-- font: jetbrains mono, roboto -->
    <link
            href="https://fonts.googleapis.com"
            rel="preconnect"/>
    <link
            crossorigin
            href="https://fonts.gstatic.com"
            rel="preconnect"/>
    <link
            href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet"/>

    <!-- project css -->
    <link
            href="./css/main.css"
            rel="stylesheet"/>
</head>

<body class="body body--center-center">
<div class="header">
    <div class="container">
        <div class="header__inner">
            <div class="header__info">
                <h1 class="header__title">Simple Calculator</h1>
                <span class="header__subtitle"
                >By
              <a
                      href="https://github.com/sadakatu-tanzil"
                      rel="noopener noreferrer"
                      target="_blank">
                Sadakatu Tanzil
              </a>
            </span>
            </div>

            <a class="header__btn header__cta-link"
               href="https://github.com/sadakatu-tanzil/simple-calculator"
               target="_blank">
                Source Code
            </a>
        </div>
    </div>
</div>

<div class="calculator">
    <!-- screen -->
    <div class="calculator__head">
        <div class="calculator__screen">
            <p class="calculator__screen-text">0</p>
        </div>
    </div>

    <!-- buttons -->
    <div class="calculator__buttons">
        <div class="calculator__button-row">
            <button
                    class="calculator__button"
                    data-button-type="operator">
                <span class="calculator__button-text">√</span>
            </button>
            <button
                    class="calculator__button"
                    data-button-type="ce">
                <span class="calculator__button-text">CE</span>
            </button>
            <button
                    class="calculator__button"
                    data-button-type="c">
                <span class="calculator__button-text">C</span>
            </button>
            <button
                    class="calculator__button"
                    data-button-type="operator">
                <span class="calculator__button-text">/</span>
            </button>
        </div>

        <div class="calculator__button-row">
            <button
                    class="calculator__button"
                    data-button-type="numeric"
                    data-button-value="7">
                <span class="calculator__button-text">7</span>
            </button>
            <button
                    class="calculator__button"
                    data-button-type="numeric"
                    data-button-value="8">
                <span class="calculator__button-text">8</span>
            </button>
            <button
                    class="calculator__button"
                    data-button-type="numeric"
                    data-button-value="9">
                <span class="calculator__button-text">9</span>
            </button>
            <button
                    class="calculator__button"
                    data-button-type="operator">
                <span class="calculator__button-text">*</span>
            </button>
        </div>

        <div class="calculator__button-row">
            <button
                    class="calculator__button"
                    data-button-type="numeric"
                    data-button-value="4">
                <span class="calculator__button-text">4</span>
            </button>
            <button
                    class="calculator__button"
                    data-button-type="numeric"
                    data-button-value="5">
                <span class="calculator__button-text">5</span>
            </button>
            <button
                    class="calculator__button"
                    data-button-type="numeric"
                    data-button-value="6">
                <span class="calculator__button-text">6</span>
            </button>
            <button
                    class="calculator__button"
                    data-button-type="operator">
                <span class="calculator__button-text">-</span>
            </button>
        </div>

        <div class="calculator__button-row">
            <button
                    class="calculator__button"
                    data-button-type="numeric"
                    data-button-value="1">
                <span class="calculator__button-text">1</span>
            </button>
            <button
                    class="calculator__button"
                    data-button-type="numeric"
                    data-button-value="2">
                <span class="calculator__button-text">2</span>
            </button>
            <button
                    class="calculator__button"
                    data-button-type="numeric"
                    data-button-value="3">
                <span class="calculator__button-text">3</span>
            </button>
            <button
                    class="calculator__button"
                    data-button-type="operator">
                <span class="calculator__button-text">+</span>
            </button>
        </div>

        <div class="calculator__button-row">
            <button
                    class="calculator__button"
                    data-button-type="numeric"
                    data-button-value="0">
                <span class="calculator__button-text">0</span>
            </button>
            <button
                    class="calculator__button"
                    data-button-type="numeric"
                    data-button-value="00">
                <span class="calculator__button-text">00</span>
            </button>
            <button
                    class="calculator__button"
                    data-button-type="numeric"
                    data-button-value="."
                    disabled>
                <span class="calculator__button-text">.</span>
            </button>
            <button
                    class="calculator__button"
                    data-button-type="equal">
                <span class="calculator__button-text">=</span>
            </button>
        </div>
    </div>
</div>

<script src="./js/main.js"></script>
</body>
</html>
